<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:," />
    <meta name="description" content="JEIGHTEEN — Music & Atelier" />
    <title>JEIGHTEEN</title>
    <script>
      // Apply the saved day/night choice before first paint so there is no white flash in night mode.
      (function () {
        try {
          var t = localStorage.getItem('jeighteen-theme');
          if (t === 'night' || t === 'day') document.documentElement.setAttribute('data-theme', t);
          if (t === 'night') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0b0b');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
